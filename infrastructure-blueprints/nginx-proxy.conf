# StackVura Technologies Production Nginx Configuration
# Architect: Moses Kariuki Mwihia

# Route 1: StackVura Portfolio (Next.js)
server {
    listen 80;
    server_name stackvuratechnologies.online www.stackvuratechnologies.online;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }
}

# Route 2: n8n Automation Engine (Requires WebSockets)
server {
    listen 80;
    server_name n8n.stackvuratechnologies.online;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
